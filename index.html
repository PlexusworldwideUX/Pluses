<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plexus U: Getting Started | Plexus</title>
<meta name="description" content="Your first 21 days as a Plexus Brand Ambassador, planned around the time you have.">
<meta name="theme-color" content="#ffffff">
<!--
  Single-file guide. Design matches the RightStart site (rightstartbonus.plexusworldwide.com).
  Strings live in STR (en, es, fr). The 21-day plan lives in DAYS; activity amounts in COUNT and MINUTES.
  Progress is saved in this browser only (localStorage). "Share with my Sponsor" makes a snapshot link (#s=...).
  No earnings figures anywhere in this tool.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root {
    --plexus: #E50046;        /* Plexus Red */
    --plexus-hover: #c2003b;
    --plexus-deep: #a10032;
    --plexus-soft: #fde8ee;
    --plexus-line: #f5c2d0;
    --ink: #111111;
    --ink-hover: #231F20;
    --ink-soft: #231f20;
    --muted: #A0A4AB;         /* Gray 450 */
    --slate: #919d9d;
    --line: #E2E2E2;          /* Gray 150 */
    --paper: #ffffff;
    --mist: #F6F6F6;          /* Gray 25 */
    --disabled: #E6E6E6;      /* Gray 75 */
    --focus: #0277BD;
    --success: #2E7D32;
    --success-tint: #E8F5E9;
    --error: #B30E0E;
    --warning: #C08A16;
    --overlay: rgba(17,17,17,.5);
    --shadow: 0 8px 24px rgba(17,17,17,.12);
    --font: "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --bar: 72px;
    --topbar-h: 72px;
    --chrome: 128px;
    --wrap-pad: 24px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font); font-size: 1rem; line-height: 1.25rem; font-weight: 300; color: var(--ink); background: var(--paper); font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; font-weight: 600; }
  h1 { font-size: 2rem; line-height: 2rem; letter-spacing: -1px; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 1.75rem; line-height: 1.75rem; letter-spacing: -1px; font-weight: 600; margin: 0 0 12px; }
  h3 { font-size: 1.5rem; line-height: 1.75rem; letter-spacing: -1px; font-weight: 300; }
  h4 { font-size: 1rem; line-height: 1rem; letter-spacing: 0; font-weight: 600; }
  .eyebrow, h5 { font-size: 0.8rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .skip { position: absolute; left: 12px; top: 8px; z-index: 80; padding: 8px 14px; background: var(--ink); color: var(--paper); border-radius: 6.25rem; font-weight: 600; text-decoration: none; transform: translateY(-160%); }
  .skip:focus { transform: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 var(--wrap-pad); }
  a { color: var(--plexus); font-weight: 600; text-underline-offset: 3px; }
  a:hover { color: var(--plexus-hover); }

  /* Top bar, language and menus (same as the RightStart site) */
  .topbar { position: sticky; top: 0; z-index: 70; background: var(--paper); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: var(--bar); }
  .brand { display: flex; align-items: center; flex: 1; min-width: 0; gap: 16px; }
  .top-tools { display: flex; align-items: center; gap: 4px; flex: none; }
  .icon-btn { display: none; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--ink); cursor: pointer; padding: 0; flex: none; touch-action: manipulation; }
  .icon-btn svg { display: block; }
  .lang-sheet-title { display: none; margin: 0; align-items: center; justify-content: space-between; gap: 8px; }
  .logo { display: block; height: 56px; width: auto; }
  .lang { display: inline-flex; border: 1px solid var(--ink); border-radius: 6.25rem; overflow: hidden; }
  .lang button { border: 0; background: var(--paper); min-height: 40px; padding: 0 16px; font-size: 0.95rem; font-weight: 600; cursor: pointer; color: var(--ink); }
  .lang button + button { border-left: 1px solid var(--ink); }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .lang button:hover { background: var(--mist); }
  .lang button[aria-pressed="true"]:hover { background: var(--ink-soft); }
  .masthead { padding: 28px 0 0; }
  .eyebrow { margin: 0 0 8px; font-size: 0.8rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--plexus); }
  .masthead h1 { margin: 0 0 8px; font-size: 2rem; line-height: 2rem; font-weight: 600; letter-spacing: -1px; }
  .masthead p { margin: 0; max-width: 62ch; font-size: 1rem; line-height: 1.25rem; font-weight: 300; }
  .subnav { position: sticky; top: var(--topbar-h); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
  .sheet-head { display: none; }
  .sheet-close { width: 44px; height: 44px; border: 0; background: transparent; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--ink); }
  .backdrop { position: fixed; top: var(--topbar-h); left: 0; right: 0; bottom: 0; background: rgba(17,17,17,.45); z-index: 55; }
  .backdrop[hidden] { display: none !important; }
  .subnav-inner { display: flex; flex-wrap: wrap; column-gap: 1.375rem; row-gap: 0; }
  .subnav-inner a { flex: 0 1 auto; border-bottom: 2px solid transparent; color: var(--ink); font-weight: 600; font-size: 1rem; line-height: 1.3; padding: 0.875rem 0.25rem 0.5rem; text-decoration: none; touch-action: manipulation; }
  .subnav-inner a:hover { color: var(--plexus); }
  .subnav-inner a[aria-current="location"] { color: var(--plexus); border-bottom-color: var(--plexus); }

  /* Shared building blocks */
  main { padding-bottom: 12px; }
  section.sec { padding: 1.75rem 0 3.25rem; }
  main .sec > h2, .setup h2 { scroll-margin-top: calc(var(--chrome) + 0.25rem); }
  h2 { margin: 0 0 12px; font-size: 1.75rem; line-height: 1.75rem; font-weight: 600; letter-spacing: -1px; }
  h3 { font-weight: 300; font-size: 1.5rem; line-height: 1.75rem; letter-spacing: -1px; }
  .lede { margin: 0 0 16px; max-width: 68ch; font-size: 1.08rem; }
  .list { margin: 0 0 14px; padding-left: 1.15rem; max-width: 70ch; }
  .list li { margin: 8px 0; padding-left: 4px; }
  .list li::marker { color: var(--plexus); }
  .help { margin: 10px 0 0; font-size: 0.95rem; color: var(--muted); }
  .note { margin: 0 0 16px; padding: 12px 14px; border-left: 3px solid var(--ink); background: var(--mist); max-width: 78ch; font-weight: 600; }
  .callout { margin: 0 0 20px; padding: 20px 22px; background: var(--mist); color: var(--ink); border-left: 4px solid var(--plexus); }
  .callout h3 { margin: 0 0 8px; font-size: 1.2rem; }
  .callout p { margin: 0 0 8px; }
  .callout p:last-child, .callout ul:last-child { margin-bottom: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: 6.25rem; font-weight: 600; cursor: pointer; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); text-decoration: none; transition: background-color .2s, color .2s, border-color .2s; }
  .btn:hover { background: var(--ink-soft); border-color: var(--ink-soft); color: var(--paper); }
  .btn-primary { background: var(--plexus); border-color: var(--plexus); color: var(--paper); }
  .btn-primary:hover { background: var(--plexus-hover); border-color: var(--plexus-hover); color: var(--paper); }
  .btn:disabled, .btn:disabled:hover { background: var(--disabled); border-color: var(--disabled); color: var(--muted); cursor: not-allowed; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  /* Step 1: pace and start date */
  .setup { padding: 22px 0 10px; }
  .setup h2 { margin: 0 0 6px; font-size: 1.35rem; }
  .setup .lede { margin-bottom: 14px; }
  .paces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pace { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 16px 18px; border: 1px solid var(--line); border-top: 4px solid var(--line); background: var(--paper); cursor: pointer; }
  .pace:hover { border-color: var(--ink); border-top-color: var(--ink); }
  .pace[aria-checked="true"] { border-color: var(--ink); border-top-color: var(--plexus); background: var(--plexus-soft); }
  .pace-name { font-size: 1.25rem; font-weight: 700; }
  .pace-hours { font-weight: 700; color: var(--plexus); }
  .pace-day { color: var(--muted); font-size: 0.95rem; }
  .pace-tag { align-self: flex-start; margin-top: 6px; padding: 2px 10px; border-radius: 6.25rem; background: var(--ink); color: var(--paper); font-size: 0.78rem; font-weight: 700; }
  .setup-row { display: grid; grid-template-columns: minmax(14rem, 18rem) minmax(14rem, 18rem); gap: 1.5rem; margin-top: 0; margin-bottom: 24px; }
  .field { margin: 0; border: 0; padding: 0; min-width: 0; }
  .field label { display: block; font-weight: 600; font-size: 1rem; margin: 0 0 0.5rem; }
  input[type="date"], input[type="text"] { width: 100%; min-height: 48px; border: 1px solid var(--ink); border-radius: 2px; background: var(--paper); padding: 0 12px; font-size: 1.05rem; }
  .field .help { margin-top: 6px; }

  /* Your day */
  .day-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 14px; }
  .day-kicker { margin: 0 0 2px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--plexus); }
  .day-title { margin: 0; font-size: clamp(1.35rem, 2.4vw, 1.65rem); font-weight: 600; letter-spacing: -0.015em; }
  .day-date { margin: 2px 0 0; color: var(--muted); font-weight: 600; }
  .day-nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .day-nav .btn { padding: 0 16px; }
  .meter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin: 0 0 16px; padding: 12px 14px; background: var(--mist); }
  .meter strong { font-size: 1.05rem; }
  .bar { flex: 1 1 180px; height: 8px; background: var(--paper); border: 1px solid var(--line); min-width: 140px; }
  .bar span { display: block; height: 100%; background: var(--plexus); width: 0; transition: width .25s; }
  .bar.complete span { background: var(--success); }
  .acts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .act { border: 1px solid var(--line); background: var(--paper); }
  .act.done { background: var(--success-tint); border-color: #c8e6c9; }
  .act-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; }
  .act-row input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--plexus); cursor: pointer; }
  .act-row input:disabled { cursor: default; }
  .act-title { font-weight: 700; font-size: 1.04rem; cursor: pointer; display: block; }
  .act.done .act-title { text-decoration: line-through; text-decoration-color: var(--success); text-decoration-thickness: 2px; }
  .act-detail { margin: 4px 0 0; color: var(--ink-soft); }
  .act-time { font-size: 0.9rem; font-weight: 700; color: var(--muted); white-space: nowrap; padding-top: 2px; }
  .act-extra { padding: 0 16px 14px 56px; display: grid; gap: 8px; justify-items: start; }
  .act-extra details { justify-self: stretch; }
  .act-extra details summary { cursor: pointer; font-weight: 700; color: var(--plexus); }
  .act-extra details summary:hover { color: var(--plexus-hover); }
  .own-note { margin: 8px 0 0; font-size: 0.92rem; color: var(--muted); max-width: 70ch; }
  .own-note strong { color: var(--plexus); }
  .own { margin: 0 0 18px; padding: 14px 16px; background: var(--plexus-soft); border-left: 4px solid var(--plexus); }
  .own strong { display: block; color: var(--plexus); margin-bottom: 2px; }
  .own p { margin: 0; }
  .script { margin: 8px 0 0; padding: 10px 12px; border-left: 3px solid var(--plexus); background: var(--paper); font-style: italic; max-width: 70ch; }
  .act.done .script { background: #f8f7fb; }
  .soon { display: inline-block; padding: 2px 10px; border-radius: 6.25rem; background: var(--mist); color: var(--muted); font-size: 0.85rem; font-weight: 700; }
  .day-msg { margin: 0 0 16px; max-width: 860px; }

  /* 21-day plan grid */
  .weeks-grid { display: grid; gap: 22px; }
  .week h3 { margin: 0 0 10px; font-size: 1.12rem; }
  .week h3 span { font-weight: 600; color: var(--muted); }
  .days { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
  .dcell { display: flex; flex-direction: column; gap: 3px; min-height: 128px; padding: 12px 10px 10px; text-align: left; border: 1px solid var(--line); background: var(--paper); cursor: pointer; position: relative; }
  .dcell:hover { border-color: var(--ink); }
  .dcell .dnum { font-size: 1.15rem; font-weight: 700; line-height: 1.15; padding-right: 22px; }
  .dcell .ddate { font-size: 0.82rem; color: var(--muted); }
  .dcell .dms { font-size: 0.88rem; font-weight: 700; color: var(--plexus); line-height: 1.25; }
  .dcell .dprog { margin-top: auto; height: 6px; background: var(--mist); border-radius: 3px; overflow: hidden; }
  .dcell .dprog span { display: block; height: 100%; background: var(--plexus); }
  .dcell.today { border-color: var(--plexus); box-shadow: inset 0 0 0 1px var(--plexus); }
  .dcell.selected { background: var(--mist); }
  .dcell.complete { background: var(--success-tint); border-color: var(--success); }
  .dcell.complete .dprog span { background: var(--success); }
  .tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 24px; }
  .tally div { padding: 14px; border: 1px solid var(--line); }
  .tally strong { display: block; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; }
  .tally span { color: var(--muted); font-size: 0.92rem; font-weight: 600; }

  /* Quick answers and resources */
  .qa { border-top: 1px solid var(--line); }
  .qa details { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .qa summary { cursor: pointer; font-weight: 700; font-size: 1.04rem; }
  .qa summary:hover { color: var(--plexus); }
  .qa p { margin: 10px 0 0; max-width: 70ch; }
  .four { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 22px; }
  .four div { padding: 14px; border: 1px solid var(--line); border-top: 4px solid var(--plexus); }
  .four strong { display: block; font-size: 1.5rem; color: var(--plexus); line-height: 1; margin-bottom: 6px; }
  .fda { font-size: 0.88rem; color: var(--muted); max-width: 78ch; margin-top: 14px; }
  .res { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .res a.card { display: block; padding: 16px 18px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .res a.card:hover { border-color: var(--ink); }
  .res a.card strong { display: block; color: var(--plexus); margin-bottom: 4px; }
  .res a.card span { color: var(--muted); font-size: 0.95rem; font-weight: 400; }
  .res .card.soon-card { padding: 16px 18px; border: 1px dashed var(--slate); background: var(--mist); }
  .res .card.soon-card strong { display: block; margin-bottom: 4px; }

  /* Sponsor sharing */
  .share-box { }
  .share-link { display: flex; gap: 8px; margin-top: 12px; }
  .share-note { margin: 12px 0 0; padding: 10px 12px; background: var(--plexus-soft); border-left: 3px solid var(--plexus); max-width: 70ch; }
  .share-link input { flex: 1; min-height: 44px; font-size: 0.92rem; }
  .sponsor-banner { background: var(--ink); color: var(--paper); }
  .sponsor-banner .wrap { padding-top: 16px; padding-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .sponsor-banner p { margin: 0; max-width: 72ch; }
  .sponsor-banner strong { color: #c9c4ea; }
  .sponsor-banner .btn { border-color: var(--paper); color: var(--paper); background: transparent; }
  .sponsor-banner .btn:hover { background: var(--paper); color: var(--ink); }
  /* Sponsor view: the plan owner's setup and sharing tools aren't needed */
  body.sponsor .setup, body.sponsor .subnav a[href="#h-share"], body.sponsor section[aria-labelledby="h-share"], body.sponsor .pace-mini, body.sponsor .edit-start, body.sponsor .pace-pill { display: none; }
  .sponsor-banner .sp-meta { display: block; margin-top: 4px; color: #d8d6e3; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 6.25rem; font-weight: 600; max-width: calc(100% - 32px); }

  .disclaimer { background: var(--mist); margin: 0; padding: 36px 0 48px; font-size: 0.95rem; color: var(--muted); }
  .disclaimer p { margin: 0 0 10px; max-width: 78ch; }
  .foot-brand { font-weight: 600; color: var(--ink); }

  /* Hide Your day section and its nav link — modal is the detail view */
  section[aria-labelledby="h-day"], .subnav-inner a[href="#h-day"] { display: none !important; }

  /* Pace dropdown in subnav */
  .pace-dd { position: relative; margin-left: auto; display: none; align-items: center; gap: 8px; }
  body.pace-docked .pace-dd { display: inline-flex; }
  .pace-dd-name { font-weight: 600; color: var(--ink); font-size: 1rem; }
  .pace-dd-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border: 0; border-radius: 6.25rem; background: var(--plexus); color: var(--paper); font-weight: 700; font-size: 0.95rem; cursor: pointer; }
  .pace-dd-btn .caret { font-size: 0.7rem; margin-left: 2px; }
  .pace-dd-btn:hover { background: var(--plexus-hover); }
  .pace-dd-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 40; min-width: 180px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; }
  .pace-dd-menu[hidden] { display: none; }
  .pace-dd-menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border-radius: 4px; min-height: 44px; }
  .pace-dd-menu button:hover, .pace-dd-menu button[aria-checked="true"] { background: var(--plexus-soft); color: var(--plexus); }
  .pace-dd-menu button span { display: block; font-size: 0.78rem; font-weight: 400; color: var(--muted); margin-top: 2px; }

  /* Day card meta */
  .dcell { position: relative; }
  .dcell .dopen { position: absolute; top: 10px; right: 8px; width: 18px; height: 18px; color: var(--ink); pointer-events: none; }
  .dcell .dmeta { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; font-weight: 700; color: var(--ink); margin-top: 6px; }
  .dcell .dmeta .dfrac { color: var(--ink); }
  .dcell.complete .dmeta { display: none; }
  .dcell .dcomplete { display: none; margin-top: auto; font-size: 0.88rem; font-weight: 700; color: var(--success); }
  .dcell.complete .dcomplete { display: block; }
  .dcell.complete .dprog { display: none; }
  .pace-mini { display: none !important; }
  .pace-mini button { border: 0; background: transparent; min-height: 44px; padding: 0 12px; font-size: 0.88rem; font-weight: 600; color: var(--ink); cursor: pointer; border-radius: 6.25rem; }
  .pace-mini button[aria-checked="true"] { color: var(--plexus); font-weight: 700; box-shadow: inset 0 -2px 0 var(--plexus); }
  .pace-mini button:hover, .pace-mini button:focus-visible { background: var(--mist); }
  .pace-tip { position: absolute; top: calc(100% + 6px); right: 0; z-index: 80; min-width: 200px; max-width: 260px; padding: 10px 12px; background: var(--ink); color: var(--paper); border-radius: 8px; font-size: 0.82rem; line-height: 1.35; pointer-events: none; box-shadow: var(--shadow); }
  .pace-tip[hidden] { display: none !important; }
  .pace-tip strong { display: block; font-weight: 700; margin-bottom: 2px; }
  .edit-start { display: none; align-items: center; gap: 4px; margin-right: 8px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 6.25rem; background: var(--paper); font-size: 0.88rem; font-weight: 600; cursor: pointer; position: relative; }
  body.edit-docked .edit-start { display: inline-flex; }
  .edit-start .caret { margin-left: 4px; font-size: 0.7rem; }
  .edit-pop { position: absolute; top: calc(100% + 8px); left: 0; z-index: 85; width: min(300px, calc(100vw - 32px)); padding: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(17,17,17,.16); }
  .edit-pop[hidden] { display: none; }
  .edit-pop label { display: block; font-size: 0.9rem; font-weight: 600; margin: 0 0 6px; color: var(--ink); }
  .edit-pop input { width: 100%; min-height: 44px; margin-bottom: 12px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
  .edit-pop .btn { width: 100%; justify-content: center; }
  .pace-sheet { display: none; }
  body.sheet-pace .pace-sheet { display: block; position: fixed; z-index: 65; left: 0; right: 0; bottom: 0; max-height: 70vh; overflow: auto; background: var(--paper); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 28px rgba(17,17,17,.16); padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); }
  .pace-sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .pace-sheet .pace { margin-bottom: 8px; min-height: 44px; }

  /* Day modal */
  .day-modal { display: none; }
  body.modal-day .day-modal { display: flex; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .day-modal-backdrop { position: absolute; inset: 0; background: var(--overlay); }
  .day-modal-panel { position: relative; z-index: 1; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--paper); border-radius: 12px; padding: 20px 22px; }
  .day-modal-close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; }
  .day-modal .day-head { margin-bottom: 12px; }
  .day-modal .day-kicker { font-weight: 800; letter-spacing: 3px; }
  @media (max-width: 860px) {
    .pace-pill { display: none; }
    body.pace-docked .pace-pill { display: inline-flex; }
    body.modal-day .day-modal { align-items: flex-end; padding: 0; }
    .day-modal-panel { width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0; }
  }
  .pace-pill { display: none; align-items: center; gap: 4px; min-height: 44px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 6.25rem; background: var(--paper); font-weight: 600; font-size: 0.88rem; cursor: pointer; }

  /* Printable plan */
  #print-plan { display: none; }
  @media print {
    body > *:not(#print-plan) { display: none !important; }
    #print-plan { display: block; font-size: 11pt; color: #000; }
    #print-plan h1 { font-size: 18pt; margin: 0 0 4pt; }
    #print-plan .p-sub { margin: 0 0 12pt; }
    #print-plan .p-day { break-inside: avoid; border-top: 1.5pt solid #000; padding: 6pt 0 8pt; }
    #print-plan .p-day h2 { font-size: 12pt; margin: 0 0 4pt; }
    #print-plan ul { list-style: none; margin: 0; padding: 0; }
    #print-plan li { margin: 2pt 0; }
    #print-plan .p-foot { margin-top: 12pt; font-size: 8.5pt; color: #444; }
    @page { margin: 0.55in; }
  }

  @media (max-width: 860px) {
    .nav-burger, .lang-burger { display: inline-flex; }
    .lang { display: none; }
    .subnav { position: static; height: 0; border: 0; background: transparent; overflow: visible; }
    .subnav-panel { display: none; }
    body.sheet-nav .subnav-panel {
      display: block; position: fixed; z-index: 60; top: var(--topbar-h); right: 0; bottom: 0;
      width: min(20rem, calc(100vw - 48px)); background: var(--paper);
      box-shadow: -12px 0 28px rgba(17,17,17,.16); overflow-y: auto; overscroll-behavior: contain;
      padding: 4px 16px calc(16px + env(safe-area-inset-bottom));
    }
    body.sheet-nav .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    body.sheet-nav .sheet-title { margin: 0; font-size: 1.15rem; font-weight: 700; }
    body.sheet-nav .subnav-inner { flex-direction: column; padding: 0; }
    body.sheet-nav .subnav-inner a { width: 100%; min-height: 3rem; padding: 0.75rem 1rem 0.75rem 0.6875rem; border-bottom: 1px solid var(--line); }
    body.sheet-nav .subnav-inner a[aria-current="location"] { background: var(--plexus-soft); border-bottom-color: var(--line); box-shadow: inset 0.1875rem 0 0 var(--plexus); }
    .dcell .dopen { width: 28px; height: 28px; }
    .pace-dd-btn { font-size: 1rem; padding: 0 16px; }
    .icon-btn svg { width: 26px; height: 26px; }
    body.sheet-lang .lang {
      display: flex; flex-direction: column; position: fixed; z-index: 60; top: var(--topbar-h); right: 0; bottom: 0;
      width: min(18rem, calc(100vw - 48px)); background: var(--paper); border: 0; border-radius: 0; overflow: auto;
      box-shadow: -12px 0 28px rgba(17,17,17,.16); padding: 8px 8px calc(16px + env(safe-area-inset-bottom));
    }
    body.sheet-nav .subnav { z-index: 60; }
    body.sheet-lang .lang-sheet-title { display: flex; font-weight: 700; font-size: 1.15rem; padding: 4px 4px 8px 12px; }
    body.sheet-lang .lang button { width: 100%; min-height: 48px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; text-align: left; padding: 0 14px; background: transparent; color: var(--ink); }
    body.sheet-lang .lang button[aria-pressed="true"] { background: var(--plexus-soft); color: var(--plexus-deep); box-shadow: inset 3px 0 0 var(--plexus); }
    body.sheet-nav, body.sheet-lang { overflow: hidden; }
    .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 800px) {
    :root { --wrap-pad: 16px; }
    .paces { grid-template-columns: 1fr; }
    .pace { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 12px; padding: 12px 14px; }
    .pace-day { flex-basis: 100%; }
    .pace-tag { margin-top: 2px; }
    .setup-row { grid-template-columns: 1fr; gap: 14px; }
    .four, .tally { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .act-row { grid-template-columns: 26px 1fr; padding: 12px 12px; }
    .act-time { grid-column: 2; padding-top: 0; }
    .act-extra { padding: 0 12px 12px 50px; }
    .masthead { padding-top: 20px; }
    .masthead p, .lede { font-size: 1.02rem; }
    .callout { padding: 14px; }
    .share-link { flex-direction: column; }
  }
  @media (max-width: 560px) {
    .logo { height: 48px; }
    .days { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dcell { min-height: 92px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>

  /* ------------------------------- Helpers ---------------------------- */
  let lang = 'en';
  const $ = s => document.querySelector(s);
  const t = (k, ...a) => { const v = STR[lang][k] !== undefined ? STR[lang][k] : STR.en[k]; return typeof v === 'function' ? v(...a) : v; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const loc = () => LOCALES[lang];
  // Dates are handled as local calendar days (YYYY-MM-DD) so time zones never shift a day
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parseYmd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const dayDiff = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  const fmtDate = (d, opts) => new Intl.DateTimeFormat(loc(), opts || { weekday: 'long', month: 'long', day: 'numeric' }).format(d);
  const cap = s => s.charAt(0).toLocaleUpperCase(loc()) + s.slice(1);
  const roundHours = m => { const h = Math.round(m / 30) / 2; return lang === 'en' ? `${h} hour${h === 1 ? '' : 's'}` : lang === 'es' ? `${String(h).replace('.', ',')} horas`.replace(',', '.') : `${String(h).replace('.', ',')} h`; };

  /* -------------------------------- State ----------------------------- */
  const KEY = 'plexus-u-plan-v1';
  const state = { pace: null, start: ymd(new Date()), done: {}, name: '', sel: null };
  let sponsor = null;   // a shared snapshot being viewed

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && typeof s === 'object') {
        if (PACES.includes(s.pace)) state.pace = s.pace;
        if (parseYmd(s.start)) state.start = s.start;
        if (s.done && typeof s.done === 'object') state.done = s.done;
        if (typeof s.name === 'string') state.name = s.name.slice(0, 40);
      }
    } catch (e) { /* storage unavailable */ }
  }
  function save() {
    if (sponsor) return;
    try { localStorage.setItem(KEY, JSON.stringify({ pace: state.pace, start: state.start, done: state.done, name: state.name })); } catch (e) { /* ignore */ }
  }
  const view = () => sponsor || state;

  /* ------------------------------ The plan ---------------------------- */
  const forPace = (entry, pace) => !entry[1] || !entry[1].length || entry[1].includes(pace);
  const actId = (day, entry) => `${day}.${entry[0]}${entry[2] ? entry[2] : ''}`;
  const minutesOf = (key, pace) => {
    const m = MINUTES[key];
    const base = typeof m === 'object' ? m[pace] : m;
    return COUNT[key] && key !== 'names' ? base * COUNT[key][pace] : base;
  };
  function dayItems(day, pace) {
    return DAYS[day].items.filter(e => forPace(e, pace)).map(e => ({ id: actId(day, e), key: e[0], ep: e[2] || null, min: minutesOf(e[0], pace) }));
  }
  const dayMinutes = (day, pace) => dayItems(day, pace).reduce((s, a) => s + a.min, 0);
  const currentDay = v => { const s = parseYmd(v.start); return s ? dayDiff(s, parseYmd(v.asOf || ymd(new Date()))) : 0; };
  const clampDay = n => Math.max(0, Math.min(21, n));

  /* ----------------------------- Rendering ---------------------------- */
  function renderPaces() {
    const v = view();
    const html = PACES.map(p => {
      const s = t('pace')[p];
      return `<button type="button" role="radio" class="pace" data-pace="${p}" aria-checked="${v.pace === p}">
        <span class="pace-name">${s.name}</span><span class="pace-hours">${s.hours}</span><span class="pace-day">${s.day}</span>${s.tag ? `<span class="pace-tag">${s.tag}</span>` : ''}
      </button>`;
    }).join('');
    $('#paces').innerHTML = html;
    const mini = $('#pace-mini');
    if (mini) mini.innerHTML = PACES.map(p => {
      const s = t('pace')[p];
      const tip = `${s.hours} · ${s.day}${s.tag ? ' · ' + s.tag : ''}`;
      return `<button type="button" role="radio" data-pace="${p}" aria-checked="${v.pace === p}" data-tip="${esc(tip)}">${s.name}</button>`;
    }).join('');
    const pill = $('#pace-pill-label');
    if (pill) pill.textContent = v.pace ? t('pace')[v.pace].name : 'Pace';
    const ddLabel = $('#pace-dd-label');
    if (ddLabel) ddLabel.textContent = v.pace ? t('pace')[v.pace].name : '';
    const ddMenu = $('#pace-dd-menu');
    if (ddMenu) ddMenu.innerHTML = PACES.map(p => {
      const s = t('pace')[p];
      const shortMap = { walk: 'up to 10hrs/wk', jog: '10–15hrs/wk', run: '20–40hrs/wk' };
      const short = shortMap[p] || s.hours;
      return `<button type="button" role="menuitemradio" data-pace="${p}" aria-checked="${v.pace === p}">${s.name}<span>${short}</span></button>`;
    }).join('');
    const sheetBody = $('#pace-sheet-body');
    if (sheetBody) sheetBody.innerHTML = html;
    updateEditChip();
    wirePaceTips();
  }
  function shortDate(d) {
    return new Intl.DateTimeFormat(loc(), { month: 'short', day: 'numeric' }).format(d).replace(/(\w+)/, '$1.');
  }
  function updateEditChip() {
    const chip = $('#edit-start-label');
    if (!chip) return;
    const v = view();
    const start = parseYmd(v.start);
    const name = v.name || (lang === 'en' ? 'Your name' : lang === 'es' ? 'Tu nombre' : 'Votre nom');
    chip.textContent = `${name} · ${start ? shortDate(start) : ''}`;
  }

  function actText(a, pace) {
    const s = STR[lang].act[a.key] || STR.en.act[a.key] || {};
    const n = COUNT[a.key] ? COUNT[a.key][pace] : '';
    const fill = str => (str || '').replace('{n}', n).replace('{h}', t('pace')[pace].hours.toLowerCase());
    if (a.key === 'podcast') return { t: t('podcastT', a.ep, t('podcast')[a.ep]), d: '', s: null };
    return { t: fill(n === 1 && s.t1 ? s.t1 : s.t), d: fill(s.d), s: s.s || null, link: s.link || null, dLink: s.dLink };
  }

  function actHTML(a, pace, readOnly) {
    const v = view();
    const x = actText(a, pace);
    const done = !!v.done[a.id];
    let extra = '';
    if (x.s) extra += `<details><summary>${t('act.say')}</summary><p class="own-note"><strong>${t('own.h')}:</strong> ${t('own.p')}</p>${x.s.map(q => `<p class="script">${esc(q)}</p>`).join('')}</details>`;
    if (a.key === 'podcast') {
      const url = CONFIG.PODCAST[a.ep];
      extra += url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${t('act.open')} →</a>` : `<span class="soon">${t('podcastSoon')}</span>`;
    } else if (a.key === 'survey' && CONFIG.SURVEY_URL) {
      extra += `<a href="${esc(CONFIG.SURVEY_URL)}" target="_blank" rel="noopener">${t('act.open')} →</a>`;
    } else if (x.link) {
      const r = (t('res').find(r => r[0] === x.link) || [x.link, x.link]);
      extra += `<a href="${LINKS[x.link]}" target="_blank" rel="noopener">${esc(r[1])} →</a>`;
    }
    const detail = a.key === 'survey' && CONFIG.SURVEY_URL ? x.dLink : x.d;
    return `<li class="act${done ? ' done' : ''}">
      <div class="act-row">
        <input type="checkbox" id="c-${a.id}" data-id="${a.id}" ${done ? 'checked' : ''} ${readOnly ? 'disabled' : ''}>
        <div><label class="act-title" for="c-${a.id}">${esc(x.t)}</label>${detail ? `<p class="act-detail">${esc(detail)}</p>` : ''}</div>
        <span class="act-time">${t('mins', a.min)}</span>
      </div>
      ${extra ? `<div class="act-extra">${extra}</div>` : ''}
    </li>`;
  }

  function renderDay() {
    const v = view(), box = $('#day');
    if (!v.pace) { box.innerHTML = `<p class="empty">${t('day.choose')}</p>`; return; }
    const raw = currentDay(v);
    const today = clampDay(raw);
    const d = state.sel === null ? today : state.sel;
    const start = parseYmd(v.start);
    const items = dayItems(d, v.pace);

  function wirePaceTips() {
    const tip = $('#pace-tip');
    if (!tip) return;
    document.querySelectorAll('#pace-mini button').forEach(btn => {
      const show = () => {
        tip.textContent = btn.dataset.tip || '';
        tip.hidden = false;
        const r = btn.getBoundingClientRect();
        tip.style.left = Math.max(8, r.left) + 'px';
        tip.style.top = (r.bottom + 6) + 'px';
        tip.style.right = 'auto';
      };
      const hide = () => { tip.hidden = true; };
      btn.addEventListener('mouseenter', show);
      btn.addEventListener('mouseleave', hide);
      btn.addEventListener('focus', show);
      btn.addEventListener('blur', hide);
    });
  }
  let focusTrapHandler = null;
  function trapFocus(container) {
    releaseFocusTrap();
    const focusables = container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    focusTrapHandler = e => {
      if (e.key !== 'Tab') return;
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    container.addEventListener('keydown', focusTrapHandler);
  }
  function releaseFocusTrap() {
    if (focusTrapHandler) {
      document.querySelectorAll('.day-modal, .edit-pop').forEach(el => el.removeEventListener('keydown', focusTrapHandler));
      focusTrapHandler = null;
    }
  }
  function refreshDayState() {

  function renderPlan() {
    const v = view();
    if (!v.pace) { $('#plan-lede').textContent = t('day.choose'); $('#weeks').innerHTML = ''; $('#tally').innerHTML = ''; return; }
    const p = t('pace')[v.pace];

    $('#weeks').innerHTML = WEEKS.map(([a, b], w) => {
      let cells = '', mins = 0;
      for (let d = a; d <= b; d++) {
        const items = dayItems(d, v.pace), n = items.filter(x => v.done[x.id]).length;
        const totalMin = items.reduce((s, x) => s + x.min, 0);
        const doneMin = items.filter(x => v.done[x.id]).reduce((s, x) => s + x.min, 0);
        mins += totalMin;
        const ms = DAYS[d].ms;
        const isComplete = items.length && n === items.length;
        cells += `<button type="button" class="dcell${d === raw ? ' today' : ''}${d === sel ? ' selected' : ''}${isComplete ? ' complete' : ''}" data-go="${d}" aria-label="${t('dayN', d)}, ${fmtDate(addDays(start, d), { month: 'short', day: 'numeric' })}${ms ? ', ' + t('ms')[ms] : ''}: ${t('day.done', n, items.length)}">
          <svg class="dopen" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 14L14 6M9 6h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="dnum">${t('dayN', d)}</span>
          <span class="ddate">${fmtDate(addDays(start, d), { weekday: 'short', month: 'short', day: 'numeric' })}</span>
          ${ms ? `<span class="dms">${t('ms')[ms]}</span>` : ''}
          <span class="dprog" aria-hidden="true"><span style="width:${items.length ? n / items.length * 100 : 0}%"></span></span>
          <span class="dmeta"><span>${doneMin}/${totalMin}min</span><span class="dfrac">${n}/${items.length}</span></span>
          <span class="dcomplete">Complete</span>
        </button>`;
      }
      return `<div class="week"><h3>${t('weeks')[w]} <span>· ${t('plan.week', roundHours(mins))}</span></h3><div class="days">${cells}</div></div>`;
    }).join('');
    // Activity totals from checked items
    const totals = { conv: 0, follow: 0, invites: 0, posts: 0 };
    for (let d = 0; d <= 21; d++) dayItems(d, v.pace).forEach(a => {
      if (!v.done[a.id]) return;
      Object.keys(TALLY).forEach(k => { if (TALLY[k].includes(a.key)) totals[k] += COUNT[a.key] ? COUNT[a.key][v.pace] : 1; });
    });
    $('#tally').innerHTML = Object.keys(totals).map(k => `<div><strong>${totals[k]}</strong><span>${t('tally')[k]}</span></div>`).join('');
  }

  /* ------------------------------ Sharing ----------------------------- */
  function encodeShare() {
    // Compact snapshot: pace, start, name, today's date, and the checked activity ids
    const ids = [];
    for (let d = 0; d <= 21; d++) dayItems(d, state.pace).forEach((a, i) => { if (state.done[a.id]) ids.push(d * 100 + i); });
    const data = { v: 1, p: PACES.indexOf(state.pace), s: state.start, n: state.name || '', a: ymd(new Date()), c: ids };
    const json = JSON.stringify(data);
    return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeShare(str) {
    try {
      let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const d = JSON.parse(decodeURIComponent(escape(atob(b64))));
      if (!d || d.v !== 1 || !PACES[d.p] || !parseYmd(d.s) || !parseYmd(d.a)) return null;
      const pace = PACES[d.p], done = {};
      (Array.isArray(d.c) ? d.c : []).forEach(code => {
        const day = Math.floor(code / 100), i = code % 100;
        if (day < 0 || day > 21) return;
        const a = dayItems(day, pace)[i];
        if (a) done[a.id] = 1;
      });
      return { pace, start: d.s, name: String(d.n || '').slice(0, 40), asOf: d.a, done };
    } catch (e) { return null; }
  }
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
  }
  async function share() {
    const note = $('#share-note');
    if (!state.pace) {
      // A link needs a plan to show, so send them back to Step 1
      note.textContent = t('share.needPace'); note.hidden = false;
      $('#h-setup').scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      const first = document.querySelector('.pace'); if (first) first.focus({ preventScroll: true });
      return;
    }
    // A preview or a file opened from a computer has no web address a Sponsor can open
    const local = !/^https?:$/.test(location.protocol);
    note.textContent = local ? t('share.local') : ''; note.hidden = !local;
    const url = location.href.replace(/[?#].*$/, '') + (lang !== 'en' ? `?lang=${lang}` : '') + '#s=' + encodeShare();
    $('#share-url').value = url;
    $('#share-link').hidden = false;
    if (navigator.share) {
      try { await navigator.share({ title: t('share.text', state.name), url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    copy(url);
  }
  async function copy(url) {
    try { await navigator.clipboard.writeText(url); toast(t('share.copied')); }
    catch (e) { const el = $('#share-url'); el.focus(); el.select(); }
  }

  /* --------------------------- Language & menus ----------------------- */
  function setLang(next, saveIt) {
    lang = STR[next] ? next : 'en';
    document.documentElement.lang = LOCALES[lang];
    document.title = t('title');
    const meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute('content', t('sub'));
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
    document.querySelectorAll('#lang-group button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('#lang-group').setAttribute('aria-label', t('nav.lang'));
    $('#nav-burger').setAttribute('aria-label', t('nav.label'));
    $('#lang-burger').setAttribute('aria-label', t('nav.lang'));
    renderStatic();
    render();
    syncChrome();
    if (saveIt) {
      try { localStorage.setItem('rs-lang', lang); } catch (e) { /* ignore */ }
      const url = new URL(location.href);
      if (lang === 'en') url.searchParams.delete('lang'); else url.searchParams.set('lang', lang);
      history.replaceState(null, '', url);
    }
  }
  function initialLang() {
    const fromUrl = new URLSearchParams(location.search).get('lang');
    if (fromUrl && STR[fromUrl]) return fromUrl;
    try { const saved = localStorage.getItem('rs-lang'); if (saved && STR[saved]) return saved; } catch (e) { /* ignore */ }
    const navLang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return STR[navLang] ? navLang : 'en';
  }
  let sheet = null;
  function setSheet(next) {
    sheet = next;
    document.body.classList.toggle('sheet-nav', next === 'nav');
    document.body.classList.toggle('sheet-lang', next === 'lang');
    const paceSheet = $('#pace-sheet');
    if (paceSheet) paceSheet.hidden = next !== 'pace';
    $('#sheet-backdrop').hidden = !next;
    $('#nav-burger').setAttribute('aria-expanded', String(next === 'nav'));
    $('#lang-burger').setAttribute('aria-expanded', String(next === 'lang'));
    const pill = $('#pace-pill');
    if (pill) pill.setAttribute('aria-expanded', String(next === 'pace'));
    document.querySelectorAll('.masthead, .setup, main, footer').forEach(el => { el.inert = !!next; });
  }
  function syncChrome() {
    const topH = Math.ceil($('.topbar').getBoundingClientRect().height);
    const narrow = window.matchMedia('(max-width: 860px)').matches;
    const subH = narrow ? 0 : Math.ceil($('.subnav').getBoundingClientRect().height);
    document.documentElement.style.setProperty('--topbar-h', topH + 'px');
    document.documentElement.style.setProperty('--chrome', (topH + subH) + 'px');
  }
  function syncCurrent() {
    const heads = [...document.querySelectorAll('main .sec > h2')].filter(h => h.offsetParent !== null);
    const chrome = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome')) || 0;
    let current = heads[0];
    heads.forEach(h => { if (h.getBoundingClientRect().top <= chrome + 12) current = h; });
    document.querySelectorAll('#section-tabs a').forEach(a => {
      if (a.getAttribute('href') === '#' + current.id) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
    });
  }

  /* ------------------------------- Events ----------------------------- */
  document.addEventListener('click', e => {
    if (e.target.closest('#pace-dd-btn')) {
      const menu = $('#pace-dd-menu');
      menu.hidden = !menu.hidden;
      $('#pace-dd-btn').setAttribute('aria-expanded', String(!menu.hidden));
      return;
    }
    if (!$('#pace-dd-menu').hidden && !e.target.closest('#pace-dd')) {
      $('#pace-dd-menu').hidden = true;
      $('#pace-dd-btn').setAttribute('aria-expanded', 'false');
    }
    if (e.target.closest('#pace-dd-menu button')) {
      const btn = e.target.closest('button');
      if (btn.dataset.pace && !sponsor) { state.pace = btn.dataset.pace; save(); render(); }
      $('#pace-dd-menu').hidden = true;
      $('#pace-dd-btn').setAttribute('aria-expanded', 'false');
      return;
    }
    if (e.target.closest('#lang-burger')) { setSheet(sheet === 'lang' ? null : 'lang'); return; }
    if (e.target.closest('#pace-pill')) { setSheet(sheet === 'pace' ? null : 'pace'); return; }
    if (e.target.closest('#edit-start')) {
      const pop = $('#edit-pop');
      pop.hidden = !pop.hidden;
      if (!pop.hidden) {
        $('#edit-name').value = state.name || '';
        $('#edit-date').value = state.start;
        trapFocus(pop);
        $('#edit-name').focus();
        $('#edit-start').setAttribute('aria-expanded', 'true');
      } else {
        releaseFocusTrap();
        $('#edit-start').setAttribute('aria-expanded', 'false');
      }
      return;
    }
    if (!$('#edit-pop').hidden && !e.target.closest('#edit-pop') && !e.target.closest('#edit-start')) {
      $('#edit-pop').hidden = true;
      releaseFocusTrap();
      $('#edit-start').setAttribute('aria-expanded', 'false');
      return;
    }
    if (e.target.closest('[data-close="modal"]')) {
      closeDayModal();
      return;
    }
    if (e.target.closest('[data-close]') || e.target.closest('#sheet-backdrop')) { setSheet(null); return; }
    const lb = e.target.closest('#lang-group button');
    if (lb) { setLang(lb.dataset.lang, true); if (sheet) setSheet(null); return; }
    if (e.target.closest('#section-tabs a') && sheet) { setSheet(null); return; }
    const pc = e.target.closest('.pace, #pace-mini button');
    if (pc && !sponsor && pc.dataset.pace) { state.pace = pc.dataset.pace; save(); render(); return; }
    const go = e.target.closest('[data-go]');
    if (go) {
      const raw = currentDay(view());
      const dayNum = go.dataset.go === 'today' ? clampDay(raw) : clampDay(Number(go.dataset.go));
      state.sel = go.dataset.go === 'today' ? null : dayNum;
      if (state.sel !== null && state.sel === clampDay(raw) && raw >= 0 && raw <= 21) state.sel = null;
      renderDay(); renderPlan();
      if (go.classList.contains('dcell')) {
        openDayModal(dayNum, go);
      } else {
        $('#h-day').scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }
      return;
    }
    const mgo = e.target.closest('[data-modal-go]');
    if (mgo && state.modalDay != null) {
      const nd = clampDay(Number(mgo.dataset.modalGo));
      openDayModal(nd, state.modalReturn);
      return;
    }
    if (e.target.closest('#share-btn')) { share(); return; }
    if (e.target.closest('#copy-btn')) { copy($('#share-url').value); return; }
    if (e.target.closest('#print-btn')) { renderPrint(); window.print(); return; }
    if (e.target.closest('#sponsor-exit')) {
      sponsor = null; state.sel = null;
      history.replaceState(null, '', location.href.split('#')[0]);
      render(); window.scrollTo({ top: 0 });
    }
  });
  document.addEventListener('change', e => {
    if (sponsor) return;
    const el = e.target;
    if (el.matches('.act-row input[type="checkbox"]')) {
      if (el.checked) state.done[el.dataset.id] = 1; else delete state.done[el.dataset.id];
      save(); refreshDayState(); renderPlan(); refreshModalIfOpen();
    } else if (el.id === 'start-date' || el.id === 'edit-date') {
      if (parseYmd(el.value)) {
        state.start = el.value;
        state.sel = null;
        if (state.modalDay != null) {
          const raw = currentDay(view());
          state.modalDay = clampDay(state.modalDay);
        }
        save(); render(); refreshModalIfOpen();
      }
    }
  });
  document.addEventListener('input', e => {
    if ((e.target.id === 'first-name' || e.target.id === 'edit-name') && !sponsor) { state.name = e.target.value.slice(0, 40); save(); updateEditChip(); refreshModalIfOpen(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.body.classList.contains('modal-day')) closeDayModal();
      else if (!$('#edit-pop').hidden) { $('#edit-pop').hidden = true; releaseFocusTrap(); $('#edit-start').setAttribute('aria-expanded', 'false'); }
      else if (sheet) setSheet(null);
    }
  });
  function updateDock() {
    if (sponsor) { document.body.classList.remove("pace-docked", "edit-docked"); return; }
    const inputs = document.querySelector(".setup-row");
    const paces = document.getElementById("paces");
    const topbarH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--topbar-h")) || 0;
    const inputsPast = inputs ? inputs.getBoundingClientRect().bottom <= topbarH : false;
    const pacesPast = paces ? paces.getBoundingClientRect().bottom <= topbarH : false;
    document.body.classList.toggle("edit-docked", inputsPast);
    document.body.classList.toggle("pace-docked", pacesPast);
  }
  window.addEventListener('scroll', () => requestAnimationFrame(() => { syncCurrent(); updateDock(); }), { passive: true });
  window.addEventListener('resize', () => { if (window.matchMedia('(min-width: 861px)').matches) setSheet(null); syncChrome(); syncCurrent(); updateDock(); });

  /* -------------------------------- Init ------------------------------ */
  load();
  if (location.hash.indexOf('#s=') === 0) {
    sponsor = decodeShare(location.hash.slice(3));
    if (!sponsor) history.replaceState(null, '', location.href.split('#')[0]);
  }
  setLang(initialLang(), false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { syncChrome(); syncCurrent(); updateDock(); });
  syncCurrent();
  updateDock();
})();
</script>
</body>
</html>
